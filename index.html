<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Reporting App</title>
  <link rel="stylesheet" href="styles.css">
  
  
</head>
<body>
      <div class="navigation-container">
        <div class="rsu-logo-n-description">
          <img src="images/AU+REC+logos+-+2022-03-31T094801.834.png" alt="">
          <div class="descriptions">
            <h2>Rivers State University</h2>
            <p>Security Incident Reporting </p>
          </div>
        </div>
    </div>
    <div class="form-container">
      <form id="incidentForm">
        <label for="description">
          <textarea id="description" name="description" placeholder="Tell us what happened today!" required></textarea>
        </label>
        <label for="isUrgent">
          <input type="checkbox" id="isUrgent" name="isUrgent"> Make report anonymous
        </label>
        <label for="file">Upload evidence
          <input type="file" id="file" name="file">
        </label>

        <button type="submit">Submit</button>
          <div id="response"></div>
     </form>
    </div>



  

  <script src="script.js"></script>
</body>
</html>
